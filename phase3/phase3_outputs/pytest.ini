[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Report
junit_family = xunit2
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --maxfail=5

markers =
    regression: Regression tests
    smoke: Smoke tests
    critical: Critical tests
    slow: Slow running tests
