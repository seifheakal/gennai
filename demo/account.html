<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenNAI Demo Account</title>
<script>
  // only reachable after signing in on login.html (see the note there)
  if (!document.cookie.split('; ').includes('session=demo')) location.replace('login.html');
</script>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px 24px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { display: block; font-weight: 600; }
  input[type=text], input[type=email] { width: 100%; box-sizing: border-box; padding: 6px; }
</style>
</head>
<body>
<h1>Your account</h1>
<nav><a href="logout.html">Log out</a></nav>
<form id="profile">
  <div>
    <label for="display">Display name</label>
    <input type="text" id="display" name="display" required minlength="3" maxlength="40">
  </div>
  <div>
    <label for="recovery">Recovery email</label>
    <input type="email" id="recovery" name="recovery" required>
  </div>
  <div><label><input type="checkbox" id="news" name="news"> Send me product news</label></div>
  <button type="submit">Save profile</button>
</form>
<script>
  document.getElementById('profile').addEventListener('submit', e => e.preventDefault());
</script>
</body>
</html>
